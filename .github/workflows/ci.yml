name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Настроить Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Проверить типы
      run: npm run typecheck

    - name: Проверить защищённые файлы
      run: npm run verify:protected

    - name: Проверить поведение
      run: npm test

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build
